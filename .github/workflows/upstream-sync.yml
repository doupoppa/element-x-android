name: Sync upstream changes

on:
  # 每周日凌晨4点自动运行（北京时间中午）
  schedule:
    - cron: '0 4 * * 0'
  # 也可以手动触发
  workflow_dispatch:
  # 当 feature 分支有更新时触发（可选）
  push:
    branches:
      - feature/wechat-style-ui

env:
  UPSTREAM_REPO: element-hq/element-x-android
  UPSTREAM_BRANCH: develop
  TARGET_BRANCH: feature/wechat-style-ui

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --local user.name "GitHub Actions Bot"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/${{ env.UPSTREAM_REPO }}.git
          git remote -v

      - name: Fetch upstream
        run: |
          git fetch upstream
          echo "--- upstream/develop 最新提交 ---"
          git log --oneline upstream/${{ env.UPSTREAM_BRANCH }} -3

      - name: Check merge status
        id: merge_status
        run: |
          # 检查目标分支与上游的差距
          MERGE_BASE=$(git merge-base HEAD upstream/${{ env.UPSTREAM_BRANCH }})
          UPSTREAM_HEAD=$(git rev-parse upstream/${{ env.UPSTREAM_BRANCH }})
          LOCAL_HEAD=$(git rev-parse HEAD)

          echo "本地最新提交: $(git log --oneline -1)"
          echo "上游最新提交: $(git log --oneline upstream/${{ env.UPSTREAM_BRANCH }} -1)"
          echo ""

          if [ "$LOCAL_HEAD" = "$UPSTREAM_HEAD" ]; then
            echo "状态: 已同步，无需合并"
            echo "sync_needed=false" >> $GITHUB_OUTPUT
          else
            echo "状态: 需要同步"
            echo "sync_needed=true" >> $GITHUB_OUTPUT
            echo "behind_count=$(git rev-list --count upstream/${{ env.UPSTREAM_BRANCH }}..HEAD)" >> $GITHUB_OUTPUT
            echo "ahead_count=$(git rev-list --count HEAD..upstream/${{ env.UPSTREAM_BRANCH }})" >> $GITHUB_OUTPUT
          fi

      - name: Merge upstream changes
        if: steps.merge_status.outputs.sync_needed == 'true'
        id: merge
        run: |
          echo "开始合并上游 ${{ env.UPSTREAM_BRANCH }} 到 ${{ env.TARGET_BRANCH }}..."
          git checkout ${{ env.TARGET_BRANCH }}
          
          # 尝试合并
          if git merge upstream/${{ env.UPSTREAM_BRANCH }} --no-edit; then
            echo "merge_result=success" >> $GITHUB_OUTPUT
            echo "合并成功，无冲突！"
          else
            echo "merge_result=conflict" >> $GITHUB_OUTPUT
            echo "检测到冲突，需要手动解决"
            git merge --abort
          fi

      - name: Push if no conflicts
        if: steps.merge.outputs.merge_result == 'success'
        run: |
          echo "推送到 origin/${{ env.TARGET_BRANCH }}..."
          git push origin ${{ env.TARGET_BRANCH }}
          echo "推送成功！"

      - name: Create PR if conflicts
        if: steps.merge.outputs.merge_result == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "创建冲突通知 PR..."
          
          # 创建临时分支
          CONFLICT_BRANCH="conflict-$(date +%Y%m%d-%H%M%S)"
          git checkout -b $CONFLICT_BRANCH
          git push origin $CONFLICT_BRANCH || true
          
          # 计算落后多少提交
          BEHIND=$(git rev-list --count HEAD..upstream/${{ env.UPSTREAM_BRANCH }})
          
          # 创建 PR 说明
          PR_BODY="## ⚠️ 上游同步冲突

上游仓库 `${{ env.UPSTREAM_REPO }}` 有 **$BEHIND** 个新提交无法自动合并到 `${{ env.TARGET_BRANCH }}`。

### 可能原因
- 微信风格 UI 的修改与上游新代码有重叠部分
- 需要手动解决冲突

### 处理建议

1. 本地检出 `feature/wechat-style-ui` 分支
2. 拉取上游最新代码
3. 解决冲突
4. 提交并推送

\`\`\`bash
git fetch upstream
git checkout feature/wechat-style-ui
git merge upstream/develop
# 解决冲突...
git push origin feature/wechat-style-ui
\`\`\`

或者用 GitHub 网页手动解决冲突。"

          # 使用 gh CLI 创建 PR
          if command -v gh &> /dev/null; then
            gh pr create \
              --title "🔀 上游同步冲突 - 需要手动处理" \
              --body "$PR_BODY" \
              --base ${{ env.TARGET_BRANCH }} \
              --head $CONFLICT_BRANCH \
              || echo "PR 创建失败，可能需要手动创建"
          else
            echo "gh CLI 不可用，跳过自动创建 PR"
          fi
          
          echo ""
          echo "=== 冲突通知已生成 ==="
          echo "请手动解决冲突后推送"

      - name: Summary
        if: steps.merge_status.outputs.sync_needed == 'true'
        run: |
          echo ""
          echo "=== 同步完成 ==="
          echo "目标分支: ${{ env.TARGET_BRANCH }}"
          echo "上游分支: ${{ env.UPSTREAM_REPO }}/${{ env.UPSTREAM_BRANCH }}"
          if [ "${{ steps.merge.outputs.merge_result }}" = "success" ]; then
            echo "状态: ✅ 自动合并并推送成功"
          elif [ "${{ steps.merge.outputs.merge_result }}" = "conflict" ]; then
            echo "状态: ⚠️ 有冲突，已创建通知"
          fi
